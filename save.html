<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>素读 · 轻助手 / 存档 001</title>
  <meta name="description" content="存档 001。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/sd_base.css">
  <link rel="stylesheet" href="css/sd_save.css">
</head>
<!-- DX-01（P0）：data-site 原由 sd_router.js 在 JS 执行后才写入，
     此前本页按 :root 默认值渲染（白底/无衬线/16px/1.7），JS 执行后瞬间跳到
     纸色/等宽/14px/1.35 —— 弱网下可见整页跳变，玩家读作「加载有问题」，
     恐怖变故障，直接违 R5。此处静态写死；router 的 setAttribute 保留（幂等）。 -->
<body data-site="save">
  <div class="sd-wrap">
    <header class="sd-slot" data-sd-slot></header>
    <p class="sd-written" data-sd-written></p>

    <main id="sd-flags" class="sd-flags"></main>

    <p class="sd-early" data-sd-early></p>

    <!-- L1-b：透明文本，长按全选可见（手机可达线索之二） -->
    <span class="sd-hidden-host" data-sd-hidden></span>

    <!-- 安全操作区（ARG-BUILD-08）：清空存档 / 回到对话。
         这里【不是恐怖区】——读起来要像设置项，不像剧情，故用最淡的一档灰。
         返回链接静态写死：无 JS 也走得回去；清档按钮由 sd_savepage.js 注入，
         无 JS 时干脆不出现，不留一个按不动的死按钮。 -->
    <section class="sd-ctl" data-sd-ctl>
      <a class="sd-ctl__back" href="index.html">← 回到对话</a>
    </section>

    <footer class="sd-foot" data-sd-footer></footer>
  </div>

  <!-- 内容层（只读）：全局 window.SD_DATA -->
  <script src="data/sd_slice.js"></script>
  <!-- 基础设施层 -->
  <script src="js/sd_state.js"></script>
  <script src="js/sd_timeline.js"></script>
  <script src="js/sd_idiolect.js"></script>
  <!-- 行为 / 谜题 -->
  <script src="js/sd_behavior.js"></script>
  <script src="js/sd_puzzle.js"></script>
  <!-- 对话机 + 路由 -->
  <script src="js/sd_dialogue.js"></script>
  <script src="js/sd_router.js"></script>
  <!-- 存档页装配 -->
  <script src="js/sd_savepage.js"></script>
</body>
</html>
