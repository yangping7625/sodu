# ==========================================================================
#  deploy.yml · GitHub Pages 部署（gh-pages 分支方案）
#
#  • 部署前先跑 J-9 红线扫描（tests/spec.js）—— 任一红线触即阻断发布。
#  • 【Gap-1 / BUILD-09】“通配发布”形态：把仓库根下的全部静态资源拷进
#    publish/，仅按排除清单剔除非玩家产物（tests / promo / .github / design /
#    node_modules / .git / publish / 以及 *.md）。这样 Phase 2 新建的
#    qsw/ soda/ xk/ files/ 等地层目录会自动进 gh-pages，无需每次改本文件。
#    （排除项里的 “/” 是 rsync 的“锚定到传输根 = 仓库根”语法，并非文件系统
#     绝对路径；源路径一律用相对 ./ ，符合子路径部署安全红线。）
#  • 排除清单与 tests/phase2_ledger.js 的 PUBLISH_EXCLUDE_DIRS/GLOBS 一一对应，
#    由 J-9 的 checkDeployManifest() 做防漂移校验。
#  • 产物根放 .nojekyll，避免 GitHub 把下划线目录当 Jekyll 处理。
#
#  使用前提（由主理人完成后才真部署）：
#    1) 在 GitHub 新建仓库，把本目录（gonglue-web/）作为独立仓库推送。
#    2) 仓库 Settings → Pages → Source 选 "Deploy from a branch" → gh-pages。
#    3) 本工作流在 push 到默认分支或手动 workflow_dispatch 时触发。
#    4) 运行环境 ubuntu-latest 自带 rsync（通配发布所用）。
# ==========================================================================
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许 peaceiris 推送到 gh-pages 分支

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: J-9 red-line scan (deploy gate)
        run: node tests/spec.js

      # 无头烟雾测试：在【子路径部署模拟】下加载真实页面、执行真实脚本。
      # 这三步会捕获 J-9 静态扫描看不见的运行期回归，例如：
      #   · 资源 404（根绝对路径在 /<repo>/ 下裸奔）
      #   · 主对话流断链 / token 未替换 / X-2 绝对日期回归
      #   · 存档页 E6 直访降级失效、R8 谜题锁死
      #   · 本机窗口/桥接/逃生舱失效，或某个 sh_*.js 整体解析失败
      - name: Smoke 1 - main dialogue flow (subpath deploy sim)
        run: node tests/smoke_main.js

      - name: Smoke 2 - save page direct-visit fallback
        run: node tests/smoke_save.js

      # ARG-BUILD-11：本机（宿主侧）。iframe 内部不在覆盖范围内 —— 那部分
      # 由 Smoke 1 / 2 各自裸开验证，两边合起来才是完整的一台机器。
      - name: Smoke 3 - device home shell (windows / bridge / escape hatch)
        run: node tests/smoke_shell.js

      - name: Assemble clean publish dir (wildcard + exclude list)
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          # 通配发布：仓库根下的全部静态资源进 publish/，
          # 仅按排除清单剔除非玩家产物。排除项里的 “/” 是 rsync 的
          # “锚定到传输根（= 仓库根）”语法，并非文件系统绝对路径。
          # Phase 2 新建的 qsw/ soda/ xk/ files/ 等地层目录会自动被包含。
          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/node_modules' \
            --exclude='/tests' \
            --exclude='/promo' \
            --exclude='/design' \
            --exclude='/docs' \
            --exclude='/publish' \
            --exclude='/tools' \
            --exclude='*.md' \
            ./ publish/
          # 确保下划线目录不被 Jekyll 吞掉（向后兼容）
          touch publish/.nojekyll

      - name: Verify required artifacts present in publish
        run: |
          set -euo pipefail
          # 防漂移：排除清单若写太宽，主站必需件会被误排。逐项点名校验。
          missing=0
          # ARG-BUILD-11：入口拆成「/（本机）+ /sd/（素读）」。
          # 漏发 sd/ 会让所有旧书签与搜索结果直接 404，必须点名守卫。
          for f in index.html save.html 404.html robots.txt favicon.svg css data js sd sh_main.css sh_main.js; do
            if [ ! -e "publish/$f" ]; then echo "MISSING publish/$f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "发布清单排除过宽，主站必需件丢失"; exit 1
          fi
          echo "publish 内容：" && ls -la publish

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
